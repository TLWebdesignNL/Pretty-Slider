MOD_PRETTYSLIDER="Pretty Slider"
MOD_PRETTYSLIDER_XML_DESCRIPTION="<p>Shows a slider with an image, title and short description per slide. The slides come from the articles of one or more categories, or you create them yourself.</p>"
MOD_PRETTYSLIDER_FIELDSET_SETTINGS_LABEL="Settings"
MOD_PRETTYSLIDER_FIELD_LOGO_DESC="<img src=\"../media/mod_prettyslider/logo.svg\" height=\"100\" alt=\"Pretty Slider\">"
MOD_PRETTYSLIDER_FIELD_OWNERINFO_DESC="<p><a href=\"https://volunteers.joomla.org/joomlers/11698-tom-van-der-laan\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fas fa-user-circle fa-fw\" aria-hidden=\"true\"></i> Created by Tom van der Laan</a><br><a href=\"https://tlwebdesign.nl/\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fas fa-building fa-fw\" aria-hidden=\"true\"></i> TLWebdesign.nl</a><br><a href=\"https://extensions.joomla.org/extension/pretty-slider/\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fab fa-joomla fa-fw\" aria-hidden=\"true\"></i> Pretty Slider Joomla Extension Directory Listing</a><br><a href=\"https://github.com/TLWebdesignNL/Pretty-Slider\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fab fa-github fa-fw\" aria-hidden=\"true\"></i> Github Project Page</a><br><a href=\"https://github.com/TLWebdesignNL/Pretty-Slider/issues\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fas fa-question-circle fa-fw\" aria-hidden=\"true\"></i> Support</a></p>"
MOD_PRETTYSLIDER_FIELD_INFO_DESC="<h3>Information</h3><p>Choose where the slides come from: <strong>Articles</strong> or <strong>Manual slides</strong>.</p><p>With <strong>Manual slides</strong> you add the slides yourself, each with an image and optionally a title, description and link.</p><p>With <strong>Articles</strong>, every published article in the selected categories becomes a slide, up to the maximum number of slides. Without a category, articles from all categories are used.</p><ul><li>An article needs an intro image or a full article image. Articles without an image are skipped.</li><li>The image alt text of the article is used for the slide. When it is empty, the article title is used.</li><li>The slide title links to the article. The description is hidden on small screens.</li><li>With autoplay, visitors get a pause button, and the slides do not start by themselves for visitors who have reduced motion turned on.</li></ul>"
