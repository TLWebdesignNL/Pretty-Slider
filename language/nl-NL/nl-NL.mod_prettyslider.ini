MOD_PRETTYSLIDER_FIELD_OWNERINFO_DESC="<p><a href=\"https://volunteers.joomla.org/joomlers/11698-tom-van-der-laan\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fas fa-user-circle fa-fw\" aria-hidden=\"true\"></i> Gemaakt door Tom van der Laan</a><br><a href=\"https://tlwebdesign.nl/\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fas fa-building fa-fw\" aria-hidden=\"true\"></i> TLWebdesign.nl</a><br><a href=\"https://extensions.joomla.org/extension/pretty-slider/\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fab fa-joomla fa-fw\" aria-hidden=\"true\"></i> Pretty Slider Joomla Extension Directory Pagina</a><br><a href=\"https://github.com/TLWebdesignNL/Pretty-Slider\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fab fa-github fa-fw\" aria-hidden=\"true\"></i> Github Project pagina</a><br><a href=\"https://github.com/TLWebdesignNL/Pretty-Slider/issues\" target=\"_blank\" rel=\"noopener noreferrer\"><i class=\"fas fa-question-circle fa-fw\" aria-hidden=\"true\"></i> Ondersteuning</a></p>"
MOD_PRETTYSLIDER_FIELD_INFO_DESC="<h3>Informatie</h3><p>Elk gepubliceerd artikel in de gekozen categorieën wordt een slide, tot het maximale aantal slides. Zonder categorie worden artikelen uit alle categorieën gebruikt.</p><ul><li>Een artikel heeft een afbeelding introtekst of een afbeelding volledig artikel nodig. Artikelen zonder afbeelding worden overgeslagen.</li><li>De alt-tekst van de artikelafbeelding wordt gebruikt voor de slide. Is die leeg, dan wordt de artikeltitel gebruikt.</li><li>De titel van de slide linkt naar het artikel. De omschrijving is verborgen op kleine schermen.</li><li>Bij automatisch afspelen krijgen bezoekers een pauzeknop, en de slides starten niet vanzelf bij bezoekers die verminderde beweging hebben ingeschakeld.</li></ul>"
