MOD_PRETTYSLIDER="Pretty Slider"
MOD_PRETTYSLIDER_XML_DESCRIPTION="<p>Toont een slider met per slide een afbeelding, titel en korte omschrijving. De slides komen uit de artikelen van een of meer categorieën, of u maakt ze zelf aan.</p>"
